name: OIDC conformance

# Runs the OpenID Foundation's conformance suite (the hosted instance at
# certification.openid.net) against a deployed FlareID. The suite has to reach
# the OP over the internet and drive its login page, so this targets a real
# deployment rather than the CI runner.
#
# Needs, in the repository settings:
#   secrets.CONFORMANCE_TOKEN            a permanent token from certification.openid.net/tokens.html
#   secrets.FLAREID_CONFORMANCE_API_KEY  a FlareID API key with clients:write and directory:write
#   vars.FLAREID_CONFORMANCE_ISSUER      the deployment to test (e.g. https://idp.tmesandbox.com)
# The job seeds two clients and a "conformance" user there (idempotent).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONFORMANCE_SERVER: https://www.certification.openid.net/
      CONFORMANCE_SERVER_MTLS: https://www.certification.openid.net/
      # Secrets are scoped to the single step that needs them (see below): a
      # third-party suite or a hijacked PyPI release must not inherit them.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Seed clients and the test user, write the plan config
        env:
          FLAREID_ISSUER: ${{ vars.FLAREID_CONFORMANCE_ISSUER }}
          FLAREID_API_KEY: ${{ secrets.FLAREID_CONFORMANCE_API_KEY }}
        run: node scripts/oidc-suite-setup.mjs

      - name: Fetch the suite's runner (pinned commit)
        run: |
          # Clone the tagged release, then verify it is the reviewed commit:
          # the tag itself is mutable and this job runs with secrets in scope.
          git clone --depth 1 --branch release-v5.3.4 https://gitlab.com/openid/conformance-suite.git /tmp/suite
          git -C /tmp/suite checkout 23353b36957d6466010de767c812d2c91ed37638
          pip install --quiet --require-hashes -r conformance/requirements.txt

      - name: OP certification plans
        env:
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        working-directory: /tmp/suite/scripts
        run: |
          # All nine OP profiles a code-only OP can be certified for; the four
          # implicit/hybrid profiles need response_types FlareID does not issue.
          # The suite's export writes into this dir but does not create it.
          mkdir -p "$GITHUB_WORKSPACE/conformance-results"
          python3 run-test-plan.py \
            --expected-failures-file "$GITHUB_WORKSPACE/conformance/expected-failures.json" \
            --expected-skips-file "$GITHUB_WORKSPACE/conformance/expected-skips.json" \
            --export-dir "$GITHUB_WORKSPACE/conformance-results" \
            "oidcc-basic-certification-test-plan[server_metadata=discovery][client_registration=static_client]" "$GITHUB_WORKSPACE/conformance/suite-config.json" \
            "oidcc-config-certification-test-plan" "$GITHUB_WORKSPACE/conformance/suite-config.json" \
            "oidcc-formpost-basic-certification-test-plan[server_metadata=discovery][client_registration=static_client]" "$GITHUB_WORKSPACE/conformance/suite-config.json" \
            "oidcc-dynamic-certification-test-plan[response_type=code]" "$GITHUB_WORKSPACE/conformance/suite-config.json" \
            "oidcc-3rdparty-init-login-certification-test-plan[response_type=code]" "$GITHUB_WORKSPACE/conformance/suite-config.json" \
            "oidcc-rp-initiated-logout-certification-test-plan[response_type=code][client_registration=static_client]" "$GITHUB_WORKSPACE/conformance/suite-config.json" \
            "oidcc-frontchannel-rp-initiated-logout-certification-test-plan[response_type=code][client_registration=static_client]" "$GITHUB_WORKSPACE/conformance/fc-suite-config.json" \
            "oidcc-backchannel-rp-initiated-logout-certification-test-plan[response_type=code][client_registration=static_client]" "$GITHUB_WORKSPACE/conformance/bc-suite-config.json" \
            "oidcc-session-management-certification-test-plan[response_type=code][client_registration=static_client]" "$GITHUB_WORKSPACE/conformance/suite-config.json"

      - name: Scrub shared secrets from the suite exports
        id: scrub
        if: always()
        env:
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: node conformance/redact-exports.mjs conformance-results conformance/suite-config.json conformance/fc-suite-config.json conformance/bc-suite-config.json

      # Never upload unscrubbed exports: if the scrub step failed or never ran,
      # the artifact step is skipped rather than publishing secrets.
      - name: Keep the suite's exported results
        if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-results
          path: conformance-results
          if-no-files-found: ignore
          # Suite exports can embed live tokens and client secrets; short retention.
          retention-days: 14
