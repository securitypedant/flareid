# The FlareID e2e instance plus real applications consuming its OIDC, SAML,
# SCIM and LDAP surfaces. See docs/real-apps.md for the test matrix.
#
#   docker compose -f e2e/compose.yml up -d --build
#   node e2e/real-apps.mjs      # seeds users/clients/SPs, writes e2e/state/
#   docker compose -f e2e/compose.yml --profile extras up -d   # heavier apps
#
# App URLs are http on localhost; the SAML profile adds a caddy proxy so SP
# ACS endpoints can be https (FlareID requires https ACS URLs). Trust caddy's
# root cert once per browser: docker compose -f e2e/compose.yml exec caddy
# cat /data/caddy/pki/authorities/local/root.crt

name: flareid-lab

services:
  flareid:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    environment:
      BOOTSTRAP_TOKEN: e2e-bootstrap-token
      # The issuer must resolve from both the browser and the app containers:
      # host.docker.internal does (Docker Desktop resolves it on the host too).
      ISSUER_URL: http://${FLAREID_HOST:-host.docker.internal}:8787
      # Lab-only: the app containers reach the IdP over the docker network on
      # plain http. Production never sets this.
      ALLOW_PLAINTEXT_HTTP: "1"
      # Pinned so sealed secrets in the persistent .wrangler volume survive
      # recreates (entrypoint would otherwise mint a fresh KEK each boot).
      KEY_ENCRYPTION_KEY: "${LAB_KEK:-t53oJcJmluRpk0zGlId894/DWXuZYipXNPd2OE2BXDYg/hSokLjQJsGfLlaNJw/e}"
    ports:
      - "8787:8787"
    # Keep wrangler's local D1/KV across recreates so seeded data (and the
    # pinned issuer) survive secret/config changes.
    volumes:
      - flareid-state:/app/.wrangler
      # Lab SAML signing material; regenerable via scripts/generate-saml-cert.mjs
      - ./state/saml-cert.pem:/run/secrets/saml-cert.pem:ro
      - ./state/saml-key.pem:/run/secrets/saml-key.pem:ro
    # Apps reach the IdP by name; the browser reaches it on localhost. Both
    # must agree on the issuer, so apps are configured with
    # http://host.docker.internal:8787 unless FLAREID_ISSUER overrides it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- OIDC RPs ----------------------------------------------------------------

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    env_file: [./state/oauth2-proxy.env]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --provider=oidc
      - --oidc-issuer-url=http://${FLAREID_HOST:-host.docker.internal}:8787
      - --upstream=http://whoami
      - --http-address=0.0.0.0:4180
      - --redirect-url=http://localhost:4180/oauth2/callback
      - --email-domain=*
      - --cookie-secret=e2e-cookie-secret-0123456789abcd
      - --cookie-secure=false
      - --scope=openid email profile groups
      - --pass-host-header=false
    ports: ["4180:4180"]
    depends_on: [flareid, whoami]

  whoami:
    image: traefik/whoami:v1.10

  grafana:
    image: grafana/grafana-oss:11.4.0
    env_file: [./state/grafana.env]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: FlareID
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://${FLAREID_HOST:-host.docker.internal}:8787/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://${FLAREID_HOST:-host.docker.internal}:8787/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://${FLAREID_HOST:-host.docker.internal}:8787/userinfo
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile groups
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'Grafana Admins') && 'Admin' || 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
    ports: ["3000:3000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [flareid]

  # BookStack hard-requires an https:// OIDC issuer in code. For the http lab
  # this needs a one-time in-container patch after each recreate:
  #   docker exec flareid-lab-bookstack-1 sed -i 's|https://|http://|' \
  #     /app/www/app/Access/Oidc/OidcProviderSettings.php
  bookstack:
    image: lscr.io/linuxserver/bookstack:24.12.1
    env_file: [./state/bookstack.env]
    environment:
      PUID: "1000"
      PGID: "1000"
      APP_URL: http://localhost:6875
      APP_KEY: "${BOOKSTACK_APP_KEY:-base64:nkWWyTfb7zNciHQ3Ia+Dt7g8ZoQhMYNL3jQjkQmPSjg=}"
      DB_HOST: bookstack-db
      DB_PORT: 3306
      DB_USERNAME: bookstack
      DB_PASSWORD: bookstack
      DB_DATABASE: bookstackapp
      AUTH_METHOD: oidc
      AUTH_AUTO_INITIATE: "false"
      OIDC_ISSUER: http://${FLAREID_HOST:-host.docker.internal}:8787
      OIDC_ISSUER_DISCOVER: "true"
      OIDC_DISPLAY_NAME_CLAIMS: name
      OIDC_GROUPS_CLAIM: groups
      OIDC_USER_TO_GROUPS: "true"
      OIDC_REMOVE_FROM_GROUPS: "true"
    ports: ["6875:80"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [flareid, bookstack-db]

  bookstack-db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: bookstack
      MYSQL_DATABASE: bookstackapp
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: bookstack

  # --- SAML SPs (profile: saml; https ACS via caddy) -----------------------------

  caddy:
    image: caddy:2.8
    profiles: ["saml"]
    ports: ["443:443", "8443:8443"]
    volumes:
      - ./state/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [flareid, simplesamlphp]

  # The image's SP.php uses deprecated "${var}" interpolation that breaks the
  # ACS under PHP 8.2. One-time patch after each recreate:
  #   docker exec flareid-lab-simplesamlphp-1 perl -pi -e 's/\$\{state\[/{\$state[/g' \
  #     /var/www/simplesamlphp/modules/saml/lib/Auth/Source/SP.php
  simplesamlphp:
    image: kenchan0130/simplesamlphp:1.19.7
    profiles: ["saml"]
    # Config is generated by e2e/real-apps.mjs into e2e/state/simplesamlphp/.
    volumes:
      - ./state/simplesamlphp/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro
      - ./state/simplesamlphp/config.php:/var/www/simplesamlphp/config/config.php:ro
      - ./state/simplesamlphp/saml20-idp-remote.php:/var/www/simplesamlphp/metadata/saml20-idp-remote.php:ro
      - ./state/simplesamlphp/flareid-signing.pem:/var/www/simplesamlphp/cert/flareid-signing.pem:ro
    depends_on: [flareid]

  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:7.0
    profiles: ["saml", "extras"]
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix
      ZBX_SAML_SETTINGS: '{"idp_entityid":"http://flareid:8787/saml/metadata","sso_url":"http://localhost:8787/saml/sso","slo_url":"http://localhost:8787/saml/slo","username_attribute":"upn","sp_entityid":"https://zabbix.lab","nameid_format":"urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"}'
    depends_on: [flareid, zabbix-db, zabbix-server]

  zabbix-server:
    image: zabbix/zabbix-server-mysql:7.0
    profiles: ["saml", "extras"]
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix
    depends_on: [zabbix-db]

  zabbix-db:
    image: mariadb:11.4
    profiles: ["saml", "extras"]
    environment:
      MYSQL_ROOT_PASSWORD: zabbix
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix

  # --- SCIM (profile: scim) ------------------------------------------------------

  syncope:
    # Apache Syncope: a real IdM exposing a SCIM service provider. Use it as an
    # outbound target for FlareID's SCIM push. SCIM needs the extension enabled -
    # see docs/real-apps.md.
    image: apache/syncope:3.0.8
    profiles: ["scim"]
    ports: ["9080:9080"]

  # --- LDAP (profile: extras) ----------------------------------------------------

  nextcloud:
    image: nextcloud:30-apache
    profiles: ["extras"]
    ports: ["8080:80"]
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin-admin-admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    depends_on: [flareid]

  vault:
    image: hashicorp/vault:1.18
    profiles: ["extras"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: e2e-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
    depends_on: [flareid]

volumes:
  caddy-data:
  flareid-state:
